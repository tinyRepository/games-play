<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дело в коробке</title>
    <script>
      addEventListener('error', function (event) {
        var node = event.target
        if (!node || (node.tagName !== 'SCRIPT' && node.tagName !== 'LINK')) return
        try {
          if (Date.now() - Number(sessionStorage.getItem('case-box:reloaded') || 0) < 30000) return
          sessionStorage.setItem('case-box:reloaded', String(Date.now()))
        } catch (error) {
          return
        }
        location.reload()
      }, true)
    </script>
    <script type="module" crossorigin src="./assets/index-DggoBnUa.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Twtesi-o.css">
  </head>

  </body>
</html>
